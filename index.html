<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prestek Intranet Dashboard</title>
    <meta name="description"
        content="Portal interno da Prestek — acesse serviços, comunicados e informações do seu setor." />
    <!-- Fontes auto-hospedadas via @fontsource (sem dependência externa) -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Material Symbols -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block"
        rel="stylesheet">
    <style>
        /* Fallback: evita que ícones apareçam como texto antes da fonte carregar */
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined', 'Material Icons', sans-serif;
            font-display: block;
        }
    </style>
</head>
